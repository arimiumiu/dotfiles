# Mouse support
set -g mouse on

# Vi-style keys in copy mode
set-window-option -g mode-keys vi

# Vim-style pane navigation (ctrl+b then h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config without restarting
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Start windows/panes at 1 instead of 0 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Resize panes with vim keys (hold ctrl+b then repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Longer scrollback history
set -g history-limit 10000
